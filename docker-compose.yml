services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      CIVIL_CODE_RAG_CORPUS_PATH: /app/data/processed/articles.jsonl
      CIVIL_CODE_RAG_INDEX_DIR: /app/data/index
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - model-cache:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
volumes:
  model-cache:
